# MarketPulse: PostgreSQL + the Streamlit app.
#
#   1. cp .env.example .env   and set DB_PASSWORD (compose refuses to start without it)
#   2. put the 9 Olist CSVs in ./data/raw   (see data/README.md)
#   3. docker compose up -d db
#   4. docker compose --profile tools run --rm pipeline      # validate, transform, load
#   5. docker compose up -d app                               # http://localhost:8501
#
# Inside compose the app reaches the database at host "db"; DB_HOST in .env is only for running outside Docker.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-marketpulse}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host by default. To inspect it from your machine add:  ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment: &dbenv
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-marketpulse}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

  pipeline:
    build: .
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment: *dbenv
    volumes:
      - ./data/raw:/app/data/raw:ro
    command: ["python", "-m", "ingestion.run_pipeline"]

volumes:
  pgdata:
